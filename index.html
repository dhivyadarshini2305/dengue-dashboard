<!DOCTYPE html>
<html>
<head>
    <title>Dengue Risk Intelligence Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI';
            margin: 0;
            background: #0f172a;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 10px;
        }

        .top-bar {
            text-align: right;
            padding: 10px 20px;
        }

        .risk-box {
            text-align: center;
            padding: 30px;
            background: #1e293b;
            margin: 20px;
            border-radius: 12px;
        }

        .risk-title {
            font-size: 28px;
            font-weight: bold;
        }

        .risk-value {
            font-size: 40px;
            margin-top: 10px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
        }

        .chart-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 500px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>

<div class="top-bar">
    <button onclick="logout()">Logout</button>
</div>

<h1>Dengue Risk Intelligence Dashboard</h1>

<!-- 🔥 MAIN RISK DISPLAY -->
<div class="risk-box">
    <div class="risk-title" id="riskTitle">Enter Year to Analyze</div>
    <div class="risk-value" id="riskValue">--</div>
</div>

<!-- 🔹 INPUT + INSIGHT -->
<div class="container">

    <div class="card">
        <h3>Year-Based Analysis</h3>

        <input id="yearInput" placeholder="Enter Year (e.g., 2022)">
        <button onclick="analyze()">Analyze</button>

        <p id="details"></p>
    </div>

    <div class="card">
        <h3>System Insight</h3>
        <p id="insightBox">Waiting for input...</p>
    </div>

</div>

<!-- 🔹 CHARTS -->
<div class="container">

    <div class="chart-card">
        <h3>Trend Analysis</h3>
        <canvas id="trendChart"></canvas>
    </div>

    <div class="chart-card">
        <h3>Year Comparison</h3>
        <canvas id="barChart"></canvas>
    </div>

</div>

<script>

// DATA
const dengueData = [
    {year: 2019, cases: 50000, deaths: 100},
    {year: 2020, cases: 20000, deaths: 50},
    {year: 2021, cases: 40000, deaths: 80},
    {year: 2022, cases: 70000, deaths: 120},
    {year: 2023, cases: 90000, deaths: 150}
];

function analyze() {

    let year = parseInt(document.getElementById("yearInput").value);
    let record = dengueData.find(d => d.year === year);

    if (!record) {
        alert("No data found");
        return;
    }

    let deathRate = (record.deaths / record.cases * 100).toFixed(2);

    let risk = "";
    let color = "";

    if (record.cases < 30000) {
        risk = "LOW RISK";
        color = "lightgreen";
    } else if (record.cases < 70000) {
        risk = "MEDIUM RISK";
        color = "orange";
    } else {
        risk = "HIGH RISK";
        color = "red";
    }

    document.getElementById("riskTitle").innerText =
        "⚠️ " + risk + " YEAR: " + year;

    document.getElementById("riskValue").innerText =
        "Cases: " + record.cases;

    document.getElementById("riskValue").style.color = color;

    document.getElementById("details").innerText =
        "Deaths: " + record.deaths + " | Death Rate: " + deathRate + "%";

    document.getElementById("insightBox").innerText =
        "Higher cases indicate stronger outbreak intensity and healthcare pressure.";
}

// Logout
function logout() {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
}

// Charts
new Chart(document.getElementById("trendChart"), {
    type: "line",
    data: {
        labels: dengueData.map(d => d.year),
        datasets: [{
            label: "Cases Trend",
            data: dengueData.map(d => d.cases),
            borderColor: "#38bdf8"
        }]
    }
});

new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: dengueData.map(d => d.year),
        datasets: [{
            label: "Cases",
            data: dengueData.map(d => d.cases),
            backgroundColor: "#38bdf8"
        }]
    }
});

</script>

</body>
</html>
