<!DOCTYPE html>
<html>
<head>
    <title>Dengue Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #0f172a;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .top-bar {
            text-align: right;
            padding: 10px 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
        }

        .chart-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 500px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        .kpi {
            text-align: center;
            margin-bottom: 10px;
        }

        #result {
            margin-top: 10px;
            font-weight: bold;
        }

        #insight {
            font-size: 14px;
            margin-top: 5px;
            color: #cbd5f5;
        }
    </style>
</head>

<body>

<script>
    // 🔐 LOGIN PROTECTION
    if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>

<div class="top-bar">
    <button onclick="logout()">Logout</button>
</div>

<h1>Dengue Analysis Dashboard</h1>

<div class="container">

    <!-- Prediction -->
    <div class="card">
        <h3>Predict Cases</h3>

        <input id="state" placeholder="State (e.g., Punjab)">
        <input id="year" placeholder="Year">
        <input id="deaths" placeholder="Deaths">

        <button onclick="predict()">Predict</button>

        <h3 id="result"></h3>
        <p id="insight"></p>
    </div>

    <!-- KPI -->
    <div class="card">
        <h3>Key Insights</h3>
        <div class="kpi">Total Cases: <span id="totalCases"></span></div>
        <div class="kpi">Top State: <span id="topState"></span></div>
    </div>

    <!-- Trend Chart -->
    <div class="chart-card">
        <h3>Year-wise Trend</h3>
        <canvas id="trendChart"></canvas>
    </div>

    <!-- State Chart -->
    <div class="chart-card">
        <h3>Top States</h3>
        <canvas id="stateChart"></canvas>
    </div>

</div>

<script>

let trendChart, stateChart;

// 🔮 PREDICTION FUNCTION
function predict() {
    let state = document.getElementById("state").value;
    let year = document.getElementById("year").value;
    let deaths = document.getElementById("deaths").value;

    fetch("https://dengue-dashboard-production.up.railway.app/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            state: state,
            year: parseInt(year),
            deaths: parseInt(deaths)
        })
    })
    .then(res => res.json())
    .then(data => {

        let risk = "";

        if (data.cases < 5000) risk = "Low Risk";
        else if (data.cases < 15000) risk = "Medium Risk";
        else risk = "High Risk";

        let resultText = "Predicted Cases: " + data.cases + " (" + risk + ")";

        let resultBox = document.getElementById("result");
        resultBox.innerText = resultText;

        // 🎨 COLOR BASED ON RISK
        if (risk === "High Risk") resultBox.style.color = "red";
        else if (risk === "Medium Risk") resultBox.style.color = "orange";
        else resultBox.style.color = "lightgreen";

        // 🧠 INSIGHT TEXT
        document.getElementById("insight").innerText =
            "Higher deaths tend to increase dengue case predictions.";
    });
}

// 🚪 LOGOUT
function logout() {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
}

// 📊 TREND CHART
trendChart = new Chart(document.getElementById("trendChart"), {
    type: "line",
    data: {
        labels: [2019, 2020, 2021, 2022, 2023],
        datasets: [{
            label: "Cases Trend",
            data: [5000, 2000, 4000, 7000, 9000],
            borderColor: "#38bdf8",
            fill: false
        }]
    }
});

// 📊 STATE CHART
stateChart = new Chart(document.getElementById("stateChart"), {
    type: "bar",
    data: {
        labels: ["Bihar", "Punjab", "Assam", "Delhi"],
        datasets: [{
            label: "Cases",
            data: [20000, 15000, 8000, 12000],
            backgroundColor: "#38bdf8"
        }]
    }
});

// 📊 KPI DATA
document.getElementById("totalCases").innerText = "54000";
document.getElementById("topState").innerText = "Bihar";

</script>

</body>
</html>
