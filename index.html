<!DOCTYPE html>
<html>
<head>
    <title>Dengue Analysis System</title>

    <style>
        body {
            font-family: 'Segoe UI';
            background: #0f172a;
            color: white;
            margin: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Dengue Year Analysis System</h1>

<div class="container">

    <div class="card">

        <h3>Analyze Dengue Data</h3>

        <input id="year" placeholder="Enter Year (e.g., 2022)">
        <button onclick="analyze()">Analyze</button>

        <div id="result"></div>

    </div>

</div>

<script>

// DATA
const dengueData = [
    {year: 2019, cases: 50000, deaths: 100},
    {year: 2020, cases: 20000, deaths: 50},
    {year: 2021, cases: 40000, deaths: 80},
    {year: 2022, cases: 70000, deaths: 120},
    {year: 2023, cases: 90000, deaths: 150}
];

function analyze() {

    let year = parseInt(document.getElementById("year").value);

    let record = dengueData.find(d => d.year === year);

    if (!record) {
        document.getElementById("result").innerText = "No data found!";
        return;
    }

    let deathRate = (record.deaths / record.cases * 100).toFixed(2);

    let risk = "";
    let color = "";

    if (record.cases < 30000) {
        risk = "LOW RISK";
        color = "lightgreen";
    }
    else if (record.cases < 70000) {
        risk = "MEDIUM RISK";
        color = "orange";
    }
    else {
        risk = "HIGH RISK";
        color = "red";
    }

    document.getElementById("result").innerHTML =
        "Total Cases: " + record.cases + "<br>" +
        "Total Deaths: " + record.deaths + "<br>" +
        "Death Rate: " + deathRate + "%<br>" +
        "<b style='color:"+color+"'>"+risk+"</b><br>" +
        "Insight: Higher cases indicate increased outbreak severity.";
}
</script>

</body>
</html>
