<!DOCTYPE html>
<html>
<head>
    <title>Dengue Risk Intelligence System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI';
            margin: 0;
            background: #0f172a;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 10px;
        }

        .top-bar {
            text-align: right;
            padding: 10px 20px;
        }

        .risk-box {
            text-align: center;
            padding: 30px;
            background: #1e293b;
            margin: 20px;
            border-radius: 12px;
        }

        .risk-title {
            font-size: 30px;
            font-weight: bold;
        }

        .risk-value {
            font-size: 40px;
            margin-top: 10px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
        }

        .chart-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 500px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        .insight {
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5f5;
        }
    </style>
</head>

<body>
<script src="data.js"></script>
<script>
function analyzeYear() {

    let year = parseInt(document.getElementById("analysisYear").value);

    let record = dengueData.find(d => d.year === year);

    if (!record) {
        document.getElementById("yearResult").innerText = "No data found!";
        return;
    }

    let deathRate = (record.deaths / record.cases * 100).toFixed(2);

    let insight = "";

    if (record.cases > 60000) {
        insight = "⚠️ High outbreak year";
    } else {
        insight = "Moderate dengue spread";
    }

    document.getElementById("yearResult").innerText =
        "Cases: " + record.cases +
        " | Deaths: " + record.deaths +
        " | Death Rate: " + deathRate + "%" +
        " | " + insight;
}
</script>

<div class="top-bar">
    <button onclick="logout()">Logout</button>
</div>

<h1>Dengue Risk Intelligence System</h1>

<!-- 🔥 MAIN RISK DISPLAY -->
<div class="risk-box">
    <div class="risk-title" id="riskTitle">System Status: Waiting Input</div>
    <div class="risk-value" id="riskValue">--</div>
</div>

<!-- 🔹 INPUT + INTELLIGENCE -->
<div class="container">

    <div class="card">
        <h3>Disease Risk Analyzer</h3>

        <input id="state" placeholder="State (e.g., Punjab)">
        <input id="year" placeholder="Year">
        <input id="deaths" placeholder="Deaths">

        <button onclick="predict()">Analyze Risk</button>

        <div class="insight" id="decision"></div>
    </div>

    <div class="card">
        <h3>System Intelligence</h3>
        <p>Total Cases: 54000</p>
        <p>High Risk Region: Bihar</p>
        <p>Trend: Increasing</p>
    </div>

</div>
<div class="card">
    <h3>Year Analysis</h3>

    <input id="analysisYear" placeholder="Enter Year (e.g., 2022)">
    <button onclick="analyzeYear()">Analyze</button>

    <p id="yearResult"></p>
</div>
<!-- 🔹 VISUAL ANALYSIS -->
<div class="container">

    <div class="chart-card">
        <h3>Trend Analysis</h3>
        <canvas id="trendChart"></canvas>
    </div>

    <div class="chart-card">
        <h3>State Comparison</h3>
        <canvas id="stateChart"></canvas>
    </div>

</div>

<script>

function predict() {

    let state = document.getElementById("state").value;
    let year = document.getElementById("year").value;
    let deaths = document.getElementById("deaths").value;

    fetch("https://dengue-dashboard-production.up.railway.app/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            state: state,
            year: parseInt(year),
            deaths: parseInt(deaths)
        })
    })
    .then(res => res.json())
    .then(data => {

        let risk = "";
        let color = "";

        if (data.cases < 5000) {
            risk = "LOW RISK";
            color = "lightgreen";
        }
        else if (data.cases < 15000) {
            risk = "MEDIUM RISK";
            color = "orange";
        }
        else {
            risk = "HIGH RISK";
            color = "red";
        }

        document.getElementById("riskTitle").innerText =
            "⚠️ " + risk + " IN " + state.toUpperCase();

        document.getElementById("riskValue").innerText =
            "Predicted Cases: " + data.cases;

        document.getElementById("riskValue").style.color = color;

        document.getElementById("decision").innerText =
            "Suggested Action: Increase monitoring and healthcare readiness.";
    });
}

function logout() {
    localStorage.removeItem("loggedIn");
    window.location.href = "login.html";
}

// Charts (same)
new Chart(document.getElementById("trendChart"), {
    type: "line",
    data: {
        labels: [2019, 2020, 2021, 2022, 2023],
        datasets: [{
            label: "Trend",
            data: [5000, 2000, 4000, 7000, 9000],
            borderColor: "#38bdf8"
        }]
    }
});

new Chart(document.getElementById("stateChart"), {
    type: "bar",
    data: {
        labels: ["Bihar", "Punjab", "Assam", "Delhi"],
        datasets: [{
            label: "Cases",
            data: [20000, 15000, 8000, 12000],
            backgroundColor: "#38bdf8"
        }]
    }
});

</script>

</body>
</html>
